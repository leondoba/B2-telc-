name: apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparer le dossier www
        run: |
          rm -rf www
          mkdir www
          test -f index.html || { echo "ERREUR: index.html introuvable a la racine du depot"; ls -la; exit 1; }
          cp index.html www/index.html
          ls -la www

      - name: Installer les dependances
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Creer la configuration Capacitor
        run: |
          echo '{"appId":"com.leophysio.telcb2","appName":"TELC B2","webDir":"www","android":{"allowMixedContent":true}}' > capacitor.config.json
          cat capacitor.config.json

      - name: Creer le projet Android
        run: npx cap add android

      - name: Synchroniser le site web dans l app
        run: npx cap sync android

      - name: Compiler APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verifier que APK existe
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk TELC-B2.apk
          ls -la TELC-B2.apk

      - name: Publier APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telc-b2-apk
          path: TELC-B2.apk

      - name: Publier APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TELC B2 derniere APK
          body: APK debug generee automatiquement. Telecharge TELC-B2.apk puis installe-la.
          files: TELC-B2.apk
